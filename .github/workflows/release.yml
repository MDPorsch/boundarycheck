name: Release

# Publishing to PyPI uses TRUSTED PUBLISHING (OpenID Connect): there is no PyPI token anywhere, not in
# the repository, not in a secret. PyPI is told, once, that this workflow in this repository (and this
# environment) may publish this project; every release then proves its identity with a short-lived
# token that GitHub mints for that one run.
#
# Nothing is published until a human approves the `pypi` environment (a required reviewer), and the
# environment accepts only tags that look like v1.2.3. See docs/releasing.md.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]    # a release is a tag, never a branch push
  workflow_dispatch:                   # build and verify only; the publish job needs a tag (see its `if`)

permissions: {}                        # nothing by default; each job asks for exactly what it needs

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_FROZEN: "1"

jobs:
  build:
    name: build and verify the distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true                 # the reference lab (public), a development-only dependency
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true
      - run: uv sync
      - name: The tag must equal the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          version="$(uv run python -c "import tomllib,sys; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          test "refs/tags/v${version}" = "${GITHUB_REF}" || { echo "tag ${GITHUB_REF} does not match version ${version}"; exit 1; }
      - run: uv run pytest -q
      - run: uv build --out-dir dist
      - name: What is in the distributions (the lab and the examples' secrets must not be)
        run: |
          set -euo pipefail
          ls -l dist
          unzip -l dist/*.whl | tail -n +4
          tar tzf dist/*.tar.gz | sort
          if unzip -l dist/*.whl | grep -E "tenantlab|/lab/"; then echo "the lab is in the wheel"; exit 1; fi
          if tar tzf dist/*.tar.gz | grep -E "(^|/)lab/"; then echo "the lab is in the sdist"; exit 1; fi
      - name: Install the wheel in a clean environment and run it (no lab, no source tree)
        run: |
          set -euo pipefail
          uv venv --python 3.13 /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          cd "$(mktemp -d)"
          /tmp/clean/bin/boundarycheck --version
          /tmp/clean/bin/boundarycheck init --output starter.yaml
          /tmp/clean/bin/boundarycheck validate --config starter.yaml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish to PyPI (needs the owner's approval of the `pypi` environment)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/boundarycheck/
    permissions:
      contents: read
      id-token: write                     # the one permission trusted publishing needs, for this job only
      attestations: write                 # PEP 740 attestations: a signed record of where the files came from
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true
